name: baylock
description: "Baylock: PDF, Word, Excel ve sunumları aç, yaz, çiz."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.3.0
  open_filex: ^5.0.0
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.5.0
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  pdf: ^3.11.1
  share_plus: ^13.3.1
  permission_handler: ^13.0.2
  pdfrx: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Türkçe karakterli PDF çıktısı için: NotoSans-Regular.ttf dosyasını
  # assets/fonts/ klasörüne koyduktan sonra aşağıdaki satırları aç.
  # assets:
  #   - assets/fonts/NotoSans-Regular.ttf
